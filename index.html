<style>
/* ==========================================================================
   MaternaSync Business Model — "Clinical Warmth" design system
   Tokens are the app's own (src/index.css).
   ========================================================================== */

:root {
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-heading: 'Plus Jakarta Sans', sans-serif;
  --font-serif: 'Fraunces', Georgia, serif;
  --font-mono: 'JetBrains Mono', monospace;

  /* Brand palette */
  --forest-deep: #123C35;
  --forest-dark: #0E302B;
  --cream-warm: #F3EEE5;
  --cream-soft: #FAF7F1;
  --sage-muted: #B8D0C2;
  --mint-soft: #DDEBE3;
  --peach-muted: #F3D8CB;
  --lavender-soft: #E5DDF2;
  --navy-deep: #17324D;
  --teal-primary: #167C72;
  --terracotta: #C86F55;

  /* Theme: Warm Clinical (default) */
  --bg-primary: var(--cream-warm);
  --bg-secondary: var(--cream-soft);
  --bg-tertiary: #ECE3D4;
  --bg-card: #FFFFFF;
  --bg-card-hover: #FFFFFF;
  --bg-glass: rgba(255, 255, 255, 0.9);

  --border-color: rgba(18, 60, 53, 0.10);
  --border-highlight: rgba(22, 124, 114, 0.35);

  --text-primary: var(--navy-deep);
  --text-secondary: #4B6269;
  --text-muted: #566860;

  --emerald-raw: var(--teal-primary);
  --emerald-raw-bg: rgba(22, 124, 114, 0.12);
  --emerald-raw-border: rgba(22, 124, 114, 0.3);

  --purple-ai: #6D4FA6;
  --purple-ai-bg: var(--lavender-soft);
  --purple-ai-border: rgba(109, 79, 166, 0.28);

  --amber-pending: #9A5B2E;
  --amber-pending-bg: var(--peach-muted);

  --rose-urgent: #9C3A22;
  --rose-urgent-bg: rgba(200, 111, 85, 0.16);

  --shadow-sm: 0 1px 2px rgba(18, 60, 53, 0.06);
  --shadow-md: 0 4px 14px rgba(18, 60, 53, 0.08);
  --shadow-lg: 0 10px 28px rgba(18, 60, 53, 0.10);

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 18px;
  --radius-full: 9999px;

  --btn-primary-bg: var(--forest-deep);
  --btn-primary-bg-hover: var(--forest-dark);

  /* Dark bar (the app's sidebar), used for the top bar */
  --sidebar-bg: var(--forest-dark);
  --sidebar-bg-elevated: #133B34;
  --sidebar-text: rgba(243, 238, 229, 0.78);
  --sidebar-text-active: var(--forest-dark);
  --sidebar-active-bg: var(--mint-soft);
  --sidebar-border: rgba(243, 238, 229, 0.10);
}

/* The dark theme is for the screen only: print is always light. */
@media screen {
  [data-theme='dark'] {
    --bg-primary: var(--forest-dark);
    --bg-secondary: #163F38;
    --bg-tertiary: #1B4740;
    --bg-card: #184039;
    --bg-card-hover: #1B4740;
    --bg-glass: rgba(14, 48, 43, 0.9);

    --border-color: rgba(243, 238, 229, 0.10);
    --border-highlight: rgba(184, 208, 194, 0.3);

    --text-primary: var(--cream-soft);
    --text-secondary: #B8D0C2;
    --text-muted: #7E9A90;

    --emerald-raw-bg: rgba(22, 124, 114, 0.22);
    --amber-pending-bg: rgba(243, 216, 203, 0.18);
    --rose-urgent-bg: rgba(200, 111, 85, 0.22);
    --purple-ai-bg: rgba(229, 221, 242, 0.14);

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
    --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.28);
    --shadow-lg: 0 10px 28px rgba(0, 0, 0, 0.32);

    --btn-primary-bg: var(--teal-primary);
    --btn-primary-bg-hover: #1d9389;

    color-scheme: dark;
  }
}

/* Page-level aliases. They only point at the tokens above (plus the one darker
   teal the brief allows) so that text keeps 4.5:1 contrast in both themes. */
:root {
  --accent-text: var(--teal-primary);                 /* large text and icons */
  --accent-small: #0F6A61;                            /* small teal text, darkened for 4.5:1 on its tint */
  --impl-text: #0F6A61;
  --pending-text: color-mix(in srgb, var(--amber-pending) 75%, #000);
  --ai-text: var(--purple-ai);
  --muted: var(--text-muted);
  --ring: var(--teal-primary);

  --bar-h: 60px;
  --subnav-h: 48px;
  color-scheme: light;
}
@media screen {
  [data-theme='dark'] {
    --accent-text: var(--btn-primary-bg-hover);
    --accent-small: var(--sage-muted);
    --impl-text: var(--mint-soft);
    --pending-text: var(--peach-muted);
    --ai-text: var(--lavender-soft);
    --muted: var(--text-secondary);
    --ring: var(--sage-muted);
  }
}
body.presenting { --bar-h: 0px; --subnav-h: 0px; }

/* -------------------------------------------------------------------------
   Base
   ------------------------------------------------------------------------- */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-sans);
  background-color: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading);
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text-primary);
}
.page-title {
  font-family: var(--font-serif);
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--text-primary);
}
a { color: inherit; }
button { font-family: inherit; }
ul, ol { list-style: none; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-highlight); border-radius: var(--radius-full); }
::-webkit-scrollbar-thumb:hover { background: var(--teal-primary); }

/* Keyboard users can always see where they are. */
:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
.topbar :focus-visible, .exit-pill:focus-visible { outline-color: #f3b95f; }
main:focus { outline: none; }

/* A link that appears when a keyboard user tabs in. */
.skip-link {
  position: absolute; left: 12px; top: -64px; z-index: 300;
  padding: 10px 16px; border-radius: var(--radius-md);
  background: #fff; color: var(--forest-dark); font-weight: 700; text-decoration: none;
  box-shadow: var(--shadow-md);
}
.skip-link:focus { top: 12px; }

/* Lucide icons: sized by the --i variable of the surrounding component. */
:is(i[data-lucide], svg.lucide) { width: var(--i, 16px); height: var(--i, 16px); flex: none; display: inline-block; }

.container { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

/* -------------------------------------------------------------------------
   Motion: the app's fadeIn, nothing else
   ------------------------------------------------------------------------- */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}
html.js .reveal { opacity: 0; }
html.js .reveal.in-view { opacity: 1; animation: fadeIn 0.2s ease-out; }

/* -------------------------------------------------------------------------
   Cards, badges, buttons (the app's recipes)
   ------------------------------------------------------------------------- */
.glass-panel {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.15s ease, border-color 0.15s ease;
}
.glass-panel:hover { box-shadow: var(--shadow-md); }

.badge-raw, .badge-ai, .badge-pending, .badge-neutral {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: var(--radius-full);
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.02em;
  border: 1px solid transparent; --i: 12px; line-height: 1.5;
}
.badge-raw     { background: var(--emerald-raw-bg); color: var(--impl-text); border-color: var(--emerald-raw-border); }
.badge-ai      { background: var(--purple-ai-bg);   color: var(--ai-text);   border-color: var(--purple-ai-border); }
.badge-pending { background: var(--amber-pending-bg); color: var(--pending-text); border-color: rgba(154, 91, 46, 0.25); }
.badge-neutral { background: var(--bg-tertiary);    color: var(--muted);     border-color: var(--border-color); }

/* Small status tag next to a list item */
.tag {
  display: inline-flex; align-items: center; margin-left: 6px; vertical-align: 1px;
  padding: 1px 8px; border-radius: var(--radius-full);
  font-size: 0.68rem; font-weight: 700; letter-spacing: 0.02em; line-height: 1.5;
  border: 1px solid transparent; white-space: nowrap;
}
.tag-built   { background: var(--emerald-raw-bg);   color: var(--impl-text);    border-color: var(--emerald-raw-border); }
.tag-warn    { background: var(--amber-pending-bg); color: var(--pending-text); border-color: rgba(154, 91, 46, 0.25); }
.tag-planned { background: var(--bg-tertiary);      color: var(--muted);        border-color: var(--border-color); }

.btn-primary {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--btn-primary-bg); color: #ffffff;
  font-weight: 600; font-size: 0.875rem; padding: 9px 18px;
  border-radius: var(--radius-md); border: none; cursor: pointer; text-decoration: none;
  box-shadow: var(--shadow-sm);
  transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
}
.btn-primary:hover { background: var(--btn-primary-bg-hover); box-shadow: var(--shadow-md); }
.btn-primary:active { transform: translateY(1px); }

.btn-secondary {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: transparent; color: var(--forest-deep);
  font-weight: 600; font-size: 0.875rem; padding: 8px 16px;
  border-radius: var(--radius-md); border: 1px solid rgba(18, 60, 53, 0.28);
  cursor: pointer; text-decoration: none;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.btn-secondary:hover { background: rgba(18, 60, 53, 0.06); border-color: var(--forest-deep); }
@media screen {
  [data-theme='dark'] .btn-secondary { color: var(--text-primary); border-color: var(--border-highlight); }
  [data-theme='dark'] .btn-secondary:hover { background: rgba(243, 238, 229, 0.08); border-color: var(--text-primary); }
}

.btn-outline-emerald {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; color: var(--accent-small);
  border: 1px solid var(--emerald-raw-border);
  padding: 6px 14px; border-radius: var(--radius-md);
  font-size: 0.825rem; font-weight: 600; cursor: pointer;
  transition: background 0.15s ease; --i: 15px;
}
.btn-outline-emerald:hover { background: var(--emerald-raw-bg); }
.btn-outline-emerald .chev { display: inline-flex; transition: transform 0.2s ease; }
.block.is-open .btn-outline-emerald .chev { transform: rotate(180deg); }

.tile {
  width: 46px; height: 46px; flex: none; --i: 22px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-md); background: var(--mint-soft); color: var(--forest-dark);
}
.tile.sm { width: 34px; height: 34px; --i: 18px; }

.eyebrow {
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--accent-small);
}

/* -------------------------------------------------------------------------
   Top bar (the app's sidebar colour)
   ------------------------------------------------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 100;
  height: var(--bar-h);
  background: var(--sidebar-bg);
  border-bottom: 1px solid var(--sidebar-border);
}
.topbar-inner {
  max-width: 1180px; height: 100%; margin: 0 auto; padding: 0 24px;
  display: flex; align-items: center; gap: 12px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; border-radius: var(--radius-md); }
.brand-tile {
  width: 36px; height: 36px; border-radius: var(--radius-md); flex: none; --i: 20px;
  display: flex; align-items: center; justify-content: center;
  background: var(--sidebar-active-bg); color: var(--forest-dark);
}
.brand-name { font-size: 1.05rem; font-weight: 700; color: #fff; }
.bar-divider { width: 1px; height: 22px; background: var(--sidebar-border); flex: none; }
.bar-label { font-size: 0.7rem; color: var(--sidebar-text); white-space: nowrap; }
.bar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.bar-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 36px; padding: 0 14px; border-radius: var(--radius-md); --i: 16px;
  font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.bar-btn.ghost { background: transparent; color: var(--cream-warm); border: 1px solid rgba(243, 238, 229, 0.25); }
.bar-btn.ghost:hover { background: rgba(243, 238, 229, 0.08); }
.bar-btn.mint { background: var(--sidebar-active-bg); color: var(--sidebar-text-active); border: 1px solid transparent; }
.bar-btn.mint:hover { background: var(--sage-muted); }

/* -------------------------------------------------------------------------
   Sub-navigation
   ------------------------------------------------------------------------- */
.subnav {
  position: sticky; top: var(--bar-h); z-index: 90;
  background: var(--bg-glass);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border-color);
}
.subnav-inner {
  max-width: 1180px; height: var(--subnav-h); margin: 0 auto; padding: 0 24px;
  display: flex; align-items: center; gap: 4px; overflow-x: auto;
}
.subnav a {
  display: inline-flex; flex-direction: column; align-items: center;
  padding: 6px 14px; border-radius: var(--radius-full);
  font-size: 0.85rem; font-weight: 500; color: var(--text-secondary);
  text-decoration: none; white-space: nowrap;
  transition: background 0.15s ease;
}
/* reserves the bold width so the active link does not make the row jump */
.subnav a::after { content: attr(data-text); font-weight: 700; height: 0; overflow: hidden; visibility: hidden; display: block; }
.subnav a:hover { background: var(--bg-tertiary); }
.subnav a.active { background: var(--sidebar-active-bg); color: var(--sidebar-text-active); font-weight: 700; }

/* -------------------------------------------------------------------------
   Sections
   ------------------------------------------------------------------------- */
.section { padding: 64px 0; scroll-margin-top: calc(var(--bar-h) + var(--subnav-h)); }
.section.alt { background: var(--bg-secondary); border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); }
.sec-head { max-width: 720px; margin-bottom: 32px; }
.sec-head h2 { font-size: clamp(1.7rem, 3vw, 2.3rem); line-height: 1.2; margin: 6px 0 10px; }
.sec-head p { color: var(--text-secondary); font-size: 1rem; }

/* -------------------------------------------------------------------------
   Hero (the app's landing page: cream, brand lockup, serif title)
   ------------------------------------------------------------------------- */
.hero { padding: 56px 0 64px; scroll-margin-top: 0; }
.hero-inner { display: flex; flex-direction: column; align-items: center; text-align: center; }
.lockup { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.lockup-tile {
  width: 42px; height: 42px; border-radius: 12px; --i: 22px;
  display: flex; align-items: center; justify-content: center;
  background: var(--forest-dark); color: var(--mint-soft);
}
.lockup-name { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); }
.hero .badge-pending { margin-bottom: 18px; }
.hero-title { font-size: clamp(2.2rem, 5vw, 3.4rem); line-height: 1.1; margin-bottom: 14px; }
.hero-title .accent { color: var(--accent-text); }
.hero-sub { font-size: 1.25rem; font-weight: 500; color: var(--text-primary); max-width: 640px; margin-bottom: 12px; }
.hero-support { font-size: 1.05rem; color: var(--text-secondary); max-width: 560px; margin-bottom: 28px; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 32px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; --i: 16px;
  padding: 7px 14px; border-radius: var(--radius-full);
  background: var(--bg-card); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm);
  font-size: 0.85rem; font-weight: 600; color: var(--text-primary);
}
.chip :is(i, svg) { color: var(--accent-text); }

/* -------------------------------------------------------------------------
   Canvas
   ------------------------------------------------------------------------- */
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 20px; }
.legend-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

/* Value Propositions runs across the top (its four detail columns sit side by side inside it).
   The other eight blocks sit in two rows of cards with similar natural heights, so no card is
   stretched taller than its content. */
.canvas-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  grid-auto-rows: minmax(150px, auto);
  gap: 16px;
  grid-template-areas:
    "value         value      value     value    value"
    "partners      activities resources channels segments"
    "relationships relationships revenue revenue revenue"
    "cost          cost          cost    cost    cost";
}
.b-cost .bullets { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 8px 28px; }
/* A card that is expanded must not stretch its neighbours: in that row every card keeps its own height. */
@media (min-width: 1101px) {
  .canvas-grid:has(.row-1.is-open) .row-1,
  .canvas-grid:has(.row-2.is-open) .row-2 { align-self: start; }
  .canvas-grid:has(.row-3.is-open) .row-3 { align-self: start; }
}
.b-partners      { grid-area: partners; }
.b-activities    { grid-area: activities; }
.b-value         { grid-area: value; }
.b-relationships { grid-area: relationships; }
.b-segments      { grid-area: segments; }
.b-resources     { grid-area: resources; }
.b-channels      { grid-area: channels; }
.b-cost          { grid-area: cost; }
.b-revenue       { grid-area: revenue; }

.block { padding: 22px; display: flex; flex-direction: column; min-width: 0; }
.block > * + * { margin-top: 12px; }
.block.featured { border-color: var(--border-highlight); box-shadow: var(--shadow-md); }
.block.featured .tile { background: var(--forest-deep); color: var(--mint-soft); }
.block-head { display: flex; align-items: flex-start; gap: 10px; }
.block-title-wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; padding-top: 1px; }
.block-title { font-size: 1.1rem; line-height: 1.25; }
.block-desc { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; }
.bullets { display: flex; flex-direction: column; gap: 7px; font-size: 0.84rem; color: var(--text-secondary); }
.bullets li, .dlist li { position: relative; padding-left: 16px; overflow-wrap: anywhere; }
.bullets li::before, .dlist li::before {
  content: ""; position: absolute; left: 2px; top: 0.55em;
  width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--accent-text);
}
.callout { align-self: flex-start; }
.toggle { align-self: flex-start; }
.grow { flex: 1 1 0; margin-top: 0 !important; } /* pins the toggle to the card bottom when a row makes a card a little taller */

/* Value Propositions: the full-width, highlighted card */
.b-value { padding: 28px; }
.b-value .block-head { align-items: center; gap: 14px; }
.b-value .block-title-wrap { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.b-value .block-title { font-size: 1.4rem; }
.b-value .block-desc { font-size: 0.95rem; max-width: 720px; }
.b-value .bullets { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 8px 28px; font-size: 0.88rem; }

/* Expandable detail: height animates with grid rows */
.detail { display: grid; grid-template-rows: 0fr; margin-top: 0 !important; transition: grid-template-rows 0.2s ease; }
.block.is-open .detail { grid-template-rows: 1fr; }
.detail-inner { min-height: 0; overflow: hidden; visibility: hidden; transition: visibility 0s linear 0.2s; }
.block.is-open .detail-inner { visibility: visible; transition-delay: 0s; }
.detail-body { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border-color); display: flex; flex-direction: column; gap: 14px; }

.d-sub, .d-title {
  font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
}
.d-title { margin-bottom: 8px; }
.dlist { display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; color: var(--text-secondary); }
.dlist li { line-height: 1.45; }
.dlist strong, .cost-row strong { color: var(--text-primary); }
.d-sub + .dlist { margin-top: 8px; }
.note {
  background: var(--bg-tertiary); border-radius: var(--radius-md); padding: 10px 12px;
  font-size: 0.78rem; font-style: italic; color: var(--muted); line-height: 1.5;
}

.cols { display: grid; gap: 16px; }
.cols-4 { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.cols-3 { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.cost-list { display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; color: var(--text-secondary); }
.cost-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.cost-row .amt { font-family: var(--font-mono); font-weight: 500; font-size: 0.78rem; color: var(--text-primary); white-space: nowrap; }
.cost-row.total { margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--border-color); font-weight: 700; color: var(--text-primary); }
.cost-row.total .amt { font-weight: 500; }

.trio { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.mini { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 12px; }
.mini-label { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 0.85rem; font-weight: 700; color: var(--text-primary); }
.mini p { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.45; }
.mini-icon { width: 26px; height: 26px; --i: 14px; border-radius: var(--radius-sm); background: var(--mint-soft); color: var(--forest-dark); display: flex; align-items: center; justify-content: center; }

.journey { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 6px; }
.jstep { display: inline-flex; align-items: center; gap: 6px; flex-wrap: nowrap; max-width: 100%; }
.jchip {
  display: inline-flex; align-items: center; gap: 6px; --i: 14px;
  padding: 5px 10px; border-radius: var(--radius-full);
  background: var(--emerald-raw-bg); border: 1px solid var(--emerald-raw-border);
  font-size: 0.76rem; font-weight: 600; color: var(--text-primary);
}
.jchip :is(i, svg) { color: var(--accent-text); }
.jarrow { color: var(--muted); display: inline-flex; --i: 14px; }

.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--radius-md); background: var(--bg-tertiary); border: 1px solid var(--border-color); align-self: flex-start; }
.seg button {
  padding: 6px 12px; border: none; border-radius: calc(var(--radius-md) - 3px);
  background: transparent; color: var(--text-secondary);
  font-size: 0.78rem; font-weight: 600; cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.seg button:hover { color: var(--text-primary); }
.seg button[aria-pressed='true'] { background: var(--btn-primary-bg); color: #fff; }
.rev-view { display: flex; flex-direction: column; gap: 10px; }
.rev-view[hidden] { display: none; }
.view-title { display: none; font-size: 0.78rem; font-weight: 700; color: var(--text-primary); }
.view-caption { font-size: 0.72rem; font-weight: 600; color: var(--muted); }
.rev-list { display: flex; flex-direction: column; gap: 8px; }
.rev-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); }
.rev-name { font-size: 0.82rem; font-weight: 600; color: var(--text-primary); }
.rev-pill {
  padding: 3px 10px; border-radius: var(--radius-md); max-width: 100%;
  background: var(--emerald-raw-bg); border: 1px solid var(--emerald-raw-border);
  font-size: 0.74rem; font-weight: 600; color: var(--text-primary); line-height: 1.4;
}

/* -------------------------------------------------------------------------
   Go-to-market
   ------------------------------------------------------------------------- */
.track { --g: 20px; position: relative; }
.track-line {
  position: absolute; top: 23px; height: 3px; border-radius: var(--radius-full);
  left: calc((100% - 3 * var(--g)) / 8); right: calc((100% - 3 * var(--g)) / 8);
  background: var(--border-color);
}
.track-progress {
  display: block; height: 100%; width: 0; border-radius: var(--radius-full); background: var(--teal-primary);
  transition: width 1.2s ease-out;
}
.track.is-on .track-progress { width: 75%; }
.phases { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--g); position: relative; }
.phase { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.phase-dot {
  position: relative; z-index: 1; width: 50px; height: 50px; --i: 22px; flex: none;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-full); background: var(--forest-dark); color: var(--mint-soft);
  border: 1px solid var(--sidebar-border);
}
@media screen { [data-theme='dark'] .phase-dot { border-color: var(--border-highlight); } }
.phase-num {
  position: absolute; top: -4px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-full); background: var(--bg-card); border: 1px solid var(--border-highlight);
  color: var(--text-primary); font-family: var(--font-mono); font-size: 0.68rem; font-weight: 500;
}
.phase-card { width: 100%; flex: 1; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.phase-label { font-family: var(--font-mono); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.phase-card h3 { font-size: 1.1rem; line-height: 1.25; }
.phase.future .phase-dot { background: var(--bg-card); color: var(--muted); border: 2px dashed var(--border-highlight); }
.phase.future .phase-card { border-style: dashed; border-color: var(--border-highlight); background: transparent; }

/* -------------------------------------------------------------------------
   Packages
   ------------------------------------------------------------------------- */
.pk-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 12px; font-size: 0.8rem; color: var(--muted); }
.pk-legend .tag { margin-left: 0; }
.packages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; padding-top: 12px; }
.pkg { position: relative; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
.pkg.featured { border-color: var(--border-highlight); box-shadow: var(--shadow-md); }
.pkg-badge {
  position: absolute; top: -12px; left: 24px;
  background: var(--teal-primary); border-color: var(--teal-primary); color: #fff;
}
.pkg h3 { font-size: 1.5rem; line-height: 1.15; }
.pkg-tagline { font-size: 0.9rem; font-style: italic; color: var(--text-secondary); margin-top: -8px; }
.features { display: flex; flex-direction: column; gap: 10px; font-size: 0.86rem; color: var(--text-secondary); flex: 1; }
.features li { display: flex; align-items: flex-start; gap: 10px; line-height: 1.45; --i: 16px; }
.features li > :is(i, svg) { margin-top: 2px; color: var(--accent-text); }
.features li.warn > :is(i, svg) { color: var(--pending-text); }
.features li.planned > :is(i, svg) { color: var(--muted); }
.features .lead { font-weight: 700; color: var(--text-primary); }
.pkg-foot { padding-top: 14px; border-top: 1px dashed var(--border-color); font-size: 0.76rem; font-style: italic; color: var(--muted); }

/* -------------------------------------------------------------------------
   Pilot plan
   ------------------------------------------------------------------------- */
.stat-card-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.stat-value.xlong { font-size: 1.05rem; }
.stat { padding: 14px 18px; display: flex; align-items: center; gap: 12px; }
.stat-tile {
  width: 38px; height: 38px; flex: none; --i: 18px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-md); background: var(--bg-tertiary); color: var(--emerald-raw);
}
.stat-body { min-width: 0; }
.stat-value { font-size: 1.35rem; font-weight: 800; line-height: 1.15; color: var(--text-primary); }
.stat-label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); }
.stat-sub { margin-top: 3px; font-size: 0.7rem; font-style: italic; color: var(--muted); }
.stat-sub .tag { margin-left: 0; font-style: normal; }
.smallprint { margin-top: 14px; font-size: 0.8rem; color: var(--muted); }
.pilot-lists { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 32px; }
.plist { padding: 26px; display: flex; flex-direction: column; gap: 14px; }
.plist.assume { border-left: 4px solid var(--terracotta); }
.plist-head { display: flex; align-items: center; gap: 12px; }
.plist h3 { font-size: 1.1rem; line-height: 1.25; }
.plist-sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
.plist .dlist { font-size: 0.88rem; gap: 9px; }

/* -------------------------------------------------------------------------
   Footer
   ------------------------------------------------------------------------- */
/* -------------------------------------------------------------------------
   Source tags (S6 ...), evidence cards and tables, the Sources list
   ------------------------------------------------------------------------- */
.stag {
  display: inline; margin: 0; padding: 0 5px;
  border-radius: var(--radius-full); border: 1px solid var(--emerald-raw-border); background: var(--bg-card);
  color: var(--accent-small); font-family: var(--font-mono); font-size: 0.68rem; font-weight: 500;
  font-style: normal; letter-spacing: 0; text-transform: none; line-height: 1.6; text-decoration: none;
}
.stag:hover { border-color: var(--accent-small); }
.d-text { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.5; margin-top: 6px; }
.d-sub + .d-text { margin-top: 8px; }

.ev-group { margin-top: 44px; }
.ev-group:first-of-type { margin-top: 8px; }
.ev-title { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 16px; }
.ev-title h3 { font-size: 1.4rem; line-height: 1.25; }
.ev-text { max-width: 860px; font-size: 0.92rem; color: var(--text-secondary); line-height: 1.6; margin-top: 14px; }
.ev-title + .ev-text { margin-top: 0; margin-bottom: 14px; }
.ev-text strong, .ev-card p strong, .need p strong, .ev-list strong { color: var(--text-primary); }

.need-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.need { padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.need-stat { font-size: 1.45rem; line-height: 1.2; color: var(--text-primary); }
.need p { font-size: 0.86rem; color: var(--text-secondary); line-height: 1.55; }
.ev-grid { display: grid; gap: 16px; }
.ev-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.ev-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ev-card { padding: 24px; display: flex; flex-direction: column; gap: 10px; }
.ev-card.wide { grid-column: 1 / -1; }
.ev-grid-2 .ev-card:nth-child(2) { grid-row: span 2; } /* the tall card sits beside the two short ones, so no gap */
.ev-card h4 { font-size: 1rem; line-height: 1.3; }
.ev-card p { font-size: 0.88rem; color: var(--text-secondary); line-height: 1.6; }
.ev-card.takeaways { margin-top: 16px; }
.ev-card.unverified { border-left: 4px solid var(--terracotta); }
.ev-list { font-size: 0.9rem; gap: 10px; }
.numlist { counter-reset: n; display: flex; flex-direction: column; gap: 9px; font-size: 0.88rem; color: var(--text-secondary); line-height: 1.55; }
.numlist li { counter-increment: n; position: relative; padding-left: 34px; overflow-wrap: anywhere; }
.numlist li::before {
  content: counter(n); position: absolute; left: 0; top: 1px; width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center; border-radius: var(--radius-full);
  background: var(--bg-tertiary); color: var(--text-primary); font-family: var(--font-mono); font-size: 0.7rem; font-weight: 500;
}

.table-wrap { overflow-x: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
.data-table th, .data-table td { padding: 12px 16px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border-color); color: var(--text-secondary); line-height: 1.5; }
.data-table thead th { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); background: var(--bg-secondary); white-space: nowrap; }
.data-table tbody th { font-weight: 600; color: var(--text-primary); min-width: 160px; }
.data-table tbody tr:last-child th, .data-table tbody tr:last-child td { border-bottom: none; }
.data-table td strong { color: var(--text-primary); }

.sources { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.source { padding: 18px 20px; display: flex; flex-direction: column; gap: 8px; scroll-margin-top: calc(var(--bar-h) + var(--subnav-h) + 12px); }
.source:target { border-color: var(--border-highlight); box-shadow: var(--shadow-md); }
.source-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; }
.sid { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 500; padding: 1px 9px; border-radius: var(--radius-full); background: var(--bg-tertiary); color: var(--text-primary); }
.source p { font-size: 0.84rem; color: var(--text-secondary); line-height: 1.5; }
.source .d-sub { display: block; margin-bottom: 1px; }
.source-supports { color: var(--text-primary) !important; font-weight: 500; }
.source-links { display: flex; flex-direction: column; gap: 3px; }
.source-links a { font-family: var(--font-mono); font-size: 0.72rem; color: var(--accent-small); overflow-wrap: anywhere; text-underline-offset: 2px; }

.footer { background: var(--bg-secondary); border-top: 1px solid var(--border-color); padding: 32px 0 40px; font-size: 0.8rem; color: var(--muted); }
.footer p + p { margin-top: 8px; }
.footer .links { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 14px; }
.footer .links a { display: inline-flex; align-items: center; gap: 6px; --i: 14px; font-weight: 600; color: var(--accent-small); text-decoration: underline; text-underline-offset: 3px; }

/* -------------------------------------------------------------------------
   Presentation Mode
   ------------------------------------------------------------------------- */
.exit-pill {
  display: none; position: fixed; right: 20px; bottom: 20px; z-index: 200;
  align-items: center; gap: 8px; --i: 16px;
  padding: 10px 18px; border-radius: var(--radius-full); border: 1px solid rgba(243, 238, 229, 0.25);
  background: var(--sidebar-bg); color: var(--cream-warm);
  font-size: 0.85rem; font-weight: 600; cursor: pointer; box-shadow: var(--shadow-lg);
}
.exit-pill:hover { background: var(--sidebar-bg-elevated); }
body.presenting .exit-pill { display: inline-flex; }
body.presenting .topbar, body.presenting .subnav { display: none; }
body.presenting .section { padding: 40px 0; }
body.presenting .hero { padding: 32px 0 40px; }
body.presenting .sec-head { margin-bottom: 22px; }

/* -------------------------------------------------------------------------
   Responsive
   ------------------------------------------------------------------------- */
@media (max-width: 1100px) {
  .canvas-grid { display: flex; flex-direction: column; gap: 16px; }
  .block { grid-area: auto; }
  .phases { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 28px; }
  .track-line { display: none; }
  .phase { align-items: flex-start; }
  .packages { grid-template-columns: 1fr; gap: 28px; }
  .stat-card-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .need-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ev-grid-3 { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .section { padding: 48px 0; }
  .hero { padding: 40px 0 48px; }
  .stat-card-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat { padding: 12px 14px; gap: 10px; }
  .stat-value.long { font-size: 1rem; } /* the app shrinks values longer than 5 characters; here, on phones only */
  .pilot-lists { grid-template-columns: 1fr; }
  .need-grid, .ev-grid-2, .sources { grid-template-columns: 1fr; }
  .ev-grid-2 .ev-card:nth-child(2) { grid-row: auto; }

  .data-table th, .data-table td { padding: 10px 12px; }

  .subnav-inner, .container { padding-left: 16px; padding-right: 16px; }
  .subnav a { padding: 6px 11px; }
  .pkg { padding: 24px; }
}
@media (max-width: 640px) {
  .phases { grid-template-columns: 1fr; }
}
@media (max-width: 420px) {
  .subnav-inner { gap: 0; padding-left: 8px; padding-right: 8px; }
  .subnav a { padding: 6px 6px; font-size: 0.72rem; }
}

/* -------------------------------------------------------------------------
   Reduced motion: no transitions, no animation, everything shown at once
   ------------------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }

}

/* -------------------------------------------------------------------------

   ------------------------------------------------------------------------- */
@media print {

  .glass-panel, .phase, .jstep { box-shadow: none !important; break-inside: avoid; page-break-inside: avoid; }
  .section { padding: 24px 0; break-inside: auto; }

  .sec-head, .legend, .pk-legend, .smallprint { break-after: avoid; page-break-after: avoid; }
  #gtm, #packages, #pilot, #evidence { break-before: page; page-break-before: always; }
  .table-wrap { overflow: visible; }
  .data-table { font-size: 0.72rem; }
  .data-table th, .data-table td { padding: 6px 8px; }
  .data-table tr { break-inside: avoid; page-break-inside: avoid; }
  .ev-group { margin-top: 22px; break-inside: auto; }
  .ev-title { break-after: avoid; page-break-after: avoid; }
  .need-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .need { padding: 12px; }
  .need-stat { font-size: 1rem; }
  .ev-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .sources { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .source { padding: 10px 12px; gap: 4px; }
  .source-links a::after { content: none; }
  .hero { padding: 16px 0 24px; }
  /* two newspaper columns on paper keep the printout short and never split a card; the value block spans both */
  .canvas-grid { display: block; column-count: 2; column-gap: 12px; }
  .block { grid-area: auto; padding: 16px; margin-bottom: 12px; break-inside: avoid; page-break-inside: avoid; }

  .cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .b-value { padding: 14px 16px; }
  .b-value > * + * { margin-top: 8px; }
  .b-value .bullets { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 20px; font-size: 0.8rem; }
  .b-value .dlist { font-size: 0.72rem; gap: 3px; }
  .b-value .detail-body { gap: 10px; margin-top: 8px; padding-top: 10px; }
  .sec-head { margin-bottom: 14px; }
  .packages { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .pkg { padding: 18px; }
  .pkg-badge { position: static; align-self: flex-start; }
  .features { font-size: 0.8rem; }
  .detail { grid-template-rows: 1fr !important; transition: none !important; }
  .detail-inner { visibility: visible !important; overflow: visible !important; transition: none !important; }
  .rev-view, .rev-view[hidden] { display: flex !important; }
  .view-title { display: block; }
  .view-caption { display: none; }
  .track-line { display: none; }
  .phases { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 16px; }
  .phase { align-items: stretch; }
  .stat-card-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .pilot-lists { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .footer .links a::after { content: " (" attr(href) ")"; font-weight: 400; text-decoration: none; }
}

  /* =======================================================================

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const ico = (name, cls) => '<i data-lucide="' + name + '"' + (cls ? ' class="' + cls + '"' : '') + ' aria-hidden="true"></i>';
  /* **bold**, *italic*, and source tags: S6 becomes a small link to its entry in the Sources list */
  const rich = (s) => esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\bS(\d{1,2})\b/g, '<a class="stag" href="#src-S$1" title="Source S$1">S$1</a>');
  const list = (items, cls) => '<ul class="' + cls + '">' + items.map((i) => '<li>' + rich(i) + '</li>').join('') + '</ul>';
  const note = (t) => (t ? '<p class="note">' + rich(t) + '</p>' : '');
  const sub = (t) => '<h4 class="d-sub">' + rich(t) + '</h4>';
  const para = (p) => '<div>' + sub(p.sub) + '<p class="d-text">' + rich(p.text) + '</p></div>';
  const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function refreshIcons(root) {
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons(root ? { root: root } : undefined);
    }
  }

          (i < d.journey.length - 1 ? '<span class="jarrow" aria-hidden="true">' + ico('chevron-right') + '</span>' : '') + '</span>').join('') + '</div></div>',

    revenue: (d) =>
      '<div>' + sub(d.sub) + '</div>' +
      '<div class="seg" role="group" aria-label="' + esc(DATA.ui.revenueView) + '">' +
        d.views.map((v, i) => '<button type="button" data-view="' + v.key + '" aria-pressed="' + (i === 0) + '">' + esc(v.label) + '</button>').join('') + '</div>' +
      d.views.map((v, i) =>
        '<div class="rev-view" data-view-panel="' + v.key + '"' + (i === 0 ? '' : ' hidden') + '>' +
          '<p class="view-title">' + esc(v.printTitle) + '</p>' +
          (v.caption ? '<p class="view-caption">' + esc(v.caption) + '</p>' : '') +
          '<div class="rev-list">' + v.rows.map((r) =>
            '<div class="rev-row"><span class="rev-name">' + rich(r[0]) + '</span><span class="rev-pill">' + esc(r[1]) + '</span></div>').join('') + '</div>' +
        '</div>').join('') +
      '<div>' + sub(d.additionalSub) + list(d.additional, 'dlist') + '</div>' +
      (d.paragraphs || []).map(para).join('') + note(d.note)
  };

  function renderBlock(b) {
    const id = 'detail-' + b.key;
    const open = !!b.open;
    const row = DATA.canvas.rows[b.key];
    return '<article class="block glass-panel reveal b-' + b.key + (row ? ' row-' + row : '') + (b.featured ? ' featured' : '') + (open ? ' is-open' : '') + '" data-key="' + b.key + '">' +
      '<header class="block-head">' +
        '<span class="tile' + (b.featured ? '' : ' sm') + '">' + ico(b.icon) + '</span>' +
        '<div class="block-title-wrap"><h3 class="block-title page-title">' + esc(b.title) + '</h3>' + badge(b.tag) + '</div>' +
      '</header>' +
      '<p class="block-desc">' + esc(b.desc) + '</p>' +
      list(b.bullets, 'bullets') +
      (b.callout ? '<span class="callout badge-ai">' + ico('user-check') + esc(b.callout) + '</span>' : '') +
      '<span class="grow" aria-hidden="true"></span>' +
      '<button type="button" class="toggle btn-outline-emerald" aria-expanded="' + open + '" aria-controls="' + id + '">' +
        '<span class="toggle-label">' + esc(open ? DATA.ui.collapse : DATA.ui.expand) + '</span><span class="chev">' + ico('chevron-down') + '</span></button>' +
      '<div class="detail" id="' + id + '"><div class="detail-inner"><div class="detail-body">' + DETAIL[b.detail.type](b.detail) + '</div></div></div>' +
    '</article>';
  }

  function renderCanvas() {
    const c = DATA.canvas;
    $('#canvas').innerHTML = '<div class="container">' + secHead('canvas', c) +
      '<div class="legend reveal"><span class="legend-label">' + esc(c.legendLabel) + '</span>' +
        '<span class="badge-raw">' + ico('circle-check') + esc(c.legend[0]) + '</span>' +
        '<span class="badge-pending">' + ico('circle-dashed') + esc(c.legend[1]) + '</span></div>' +
      '<div class="canvas-grid" id="canvas-grid">' + c.blocks.map(renderBlock).join('') + '</div></div>';
  }

  function renderGtm() {
    const g = DATA.gtm;
    $('#gtm').innerHTML = '<div class="container">' + secHead('gtm', g) +
      '<div class="track" id="track"><div class="track-line" aria-hidden="true"><span class="track-progress"></span></div>' +
      '<ol class="phases">' + g.phases.map((p) =>
        '<li class="phase reveal' + (p.future ? ' future' : '') + '">' +
          '<div class="phase-dot">' + ico(p.icon) + '<span class="phase-num" aria-hidden="true">' + p.n + '</span></div>' +
          '<div class="phase-card glass-panel"><span class="phase-label">Phase ' + p.n + '</span><h3 class="page-title">' + esc(p.title) + '</h3>' +
            list(p.items, 'bullets') + note(p.note) + '</div></li>').join('') +
      '</ol></div></div>';
  }

  function renderPackages() {
    const p = DATA.packages;
    const tagClass = (t) => /not live-tested/i.test(t) ? 'tag-warn' : /^planned/i.test(t) ? 'tag-planned' : 'tag-built';
    const rowClass = (t) => /not live-tested/i.test(t) ? 'warn' : /^planned/i.test(t) ? 'planned' : '';
    $('#packages').innerHTML = '<div class="container">' + secHead('packages', p) +
      '<p class="pk-legend" style="margin-top:-16px;margin-bottom:12px">' + esc(p.legend.label) + ' <span>' + esc(p.legend.none) + '</span> · ' +
        '<span class="tag tag-planned">' + esc(p.legend.planned) + '</span></p>' +
      '<div class="packages">' + p.tiers.map((t) =>
        '<article class="pkg glass-panel reveal' + (t.featured ? ' featured' : '') + '">' +
          (t.featured ? '<span class="badge-raw pkg-badge">' + ico('sparkles') + esc(t.badge) + '</span>' : '') +
          '<h3 class="page-title">' + esc(t.name) + '</h3><p class="pkg-tagline">' + esc(t.tagline) + '</p>' +
          '<ul class="features">' + t.features.map((f) => {
            const o = typeof f === 'string' ? { t: f } : f;
            const cls = o.tag ? rowClass(o.tag) : '';
            const icon = cls === 'planned' ? 'circle-dashed' : 'check';
            return '<li class="' + cls + '">' + ico(icon) + '<span' + (o.lead ? ' class="lead"' : '') + '>' + esc(o.t) +
              (o.tag ? '<span class="tag ' + tagClass(o.tag) + '">' + esc(o.tag) + '</span>' : '') + '</span></li>';
          }).join('') + '</ul>' +
          '<p class="pkg-foot">' + esc(p.disclaimer) + '</p></article>').join('') + '</div></div>';
  }

  function renderPilot() {
    const d = DATA.pilot;
    const plist = (x, cls) =>
      '<article class="plist glass-panel reveal ' + cls + '"><div class="plist-head"><span class="tile sm">' + ico(x.icon) + '</span><div><h3 class="page-title">' + esc(x.title) + '</h3>' +
      (x.sub ? '<p class="plist-sub">' + esc(x.sub) + '</p>' : '') + '</div></div>' + list(x.items, 'dlist') + '</article>';
    $('#pilot').innerHTML = '<div class="container">' + secHead('pilot', d) +
      '<div class="stat-card-row">' + d.stats.map((s) =>
        '<div class="stat glass-panel reveal"><div class="stat-tile">' + ico(s.icon) + '</div><div class="stat-body">' +
          '<div class="stat-value' + (s.value.length > 5 ? ' long' : '') + (s.value.length > 10 ? ' xlong' : '') + '">' + esc(s.value) + '</div>' +
          '<div class="stat-label">' + esc(s.label) + '</div>' +
          (s.tag ? '<div class="stat-sub"><span class="tag tag-warn">' + esc(s.tag) + '</span></div>' : '') +
          (s.sub ? '<div class="stat-sub">(' + esc(s.sub) + ')</div>' : '') +
        '</div></div>').join('') + '</div>' +
      '<p class="smallprint">' + esc(d.smallprint) + '</p>' +
      '<div class="pilot-lists">' + plist(d.measure, 'measure') + plist(d.assume, 'assume') + '</div></div>';
  }

  /* ---- Evidence and Sources ---- */
  function dataTable(cols, rows, label) {
    return '<div class="table-wrap glass-panel" role="region" tabindex="0" aria-label="' + esc(label) + '"><table class="data-table"><thead><tr>' +
      cols.map((c) => '<th scope="col">' + rich(c) + '</th>').join('') + '</tr></thead><tbody>' +
      rows.map((r) => '<tr>' + r.map((c, i) => (i === 0 ? '<th scope="row">' : '<td>') + rich(c) + (i === 0 ? '</th>' : '</td>')).join('') + '</tr>').join('') +
      '</tbody></table></div>';
  }

  function renderEvidence() {
    const e = DATA.evidence;
    const group = (inner) => '<div class="ev-group reveal">' + inner + '</div>';
    const h = (t, extra) => '<div class="ev-title"><h3 class="page-title">' + esc(t) + '</h3>' + (extra || '') + '</div>';
    const text = (t) => '<p class="ev-text">' + rich(t) + '</p>';
    const card = (title, body, cls) => '<article class="ev-card glass-panel ' + (cls || '') + '"><h4>' + rich(title) + '</h4>' + body + '</article>';

    $('#evidence').innerHTML = '<div class="container">' + secHead('evidence', e) +
      group(h(e.need.title) + '<div class="need-grid">' + e.need.cards.map((c) =>
        '<article class="need glass-panel"><div class="need-stat page-title">' + esc(c.stat) + '</div><p>' + rich(c.text) + '</p></article>').join('') + '</div>') +

      group(h(e.supports.title) + '<div class="ev-grid ev-grid-3">' + e.supports.items.map((i) => card(i.lead, '<p>' + rich(i.text) + '</p>')).join('') + '</div>') +

      group(h(e.landscape.title) + dataTable(e.landscape.cols, e.landscape.rows, e.landscape.title) +
        '<div class="ev-card glass-panel takeaways"><h4>' + esc(e.landscape.takeawaysTitle) + '</h4><ol class="numlist">' +
        e.landscape.takeaways.map((t) => '<li>' + rich(t) + '</li>').join('') + '</ol></div>') +

      group(h(e.prices.title) + dataTable(e.prices.cols, e.prices.rows, e.prices.title) + text(e.prices.reading)) +

      group(h(e.costCheck.title) + dataTable(e.costCheck.cols, e.costCheck.rows, e.costCheck.title) + e.costCheck.after.map(text).join('')) +

      group(h(e.scenarios.title, '<span class="badge-pending">' + ico('triangle-alert') + esc(e.scenarios.label) + '</span>') +
        text(e.scenarios.intro) + dataTable(e.scenarios.cols, e.scenarios.rows, e.scenarios.title)) +

      group(h(e.regulation.title) + '<div class="ev-grid ev-grid-2">' + e.regulation.cards.map((c, i) =>
        card(c.title, '<p>' + rich(c.text) + '</p>', i === 0 ? 'wide' : '')).join('') + '</div>') +

      group(h(e.funding.title) + '<div class="ev-card glass-panel">' + list(e.funding.items, 'dlist ev-list') + '</div>') +

      group(h(e.notVerified.title) + '<div class="ev-card glass-panel unverified"><ol class="numlist">' +
        e.notVerified.items.map((t) => '<li>' + rich(t) + '</li>').join('') + '</ol></div>') +

      group(h(e.researchPlan.title, '<span class="badge-pending">' + esc(e.researchPlan.badge) + '</span>') +
        '<div class="ev-card glass-panel">' + list(e.researchPlan.items, 'dlist ev-list') + '</div>') +
      '</div>';
  }

  function renderSources() {
    const s = DATA.sources;
    const chip = (q) => '<span class="' + (/^Opened/.test(q) && !/Reported/.test(q) ? 'badge-raw' : /^Reported/.test(q) ? 'badge-pending' : 'badge-neutral') + '">' + esc(q) + '</span>';
    $('#sources').innerHTML = '<div class="container">' + secHead('sources', s) +
      '<ol class="sources">' + s.list.map((x) =>
        '<li class="source glass-panel reveal" id="src-' + x.id + '">' +
          '<div class="source-top"><span class="sid">' + esc(x.id) + '</span>' + chip(x.quality) + '</div>' +
          '<p class="source-supports"><span class="d-sub">' + esc(s.supportsLabel) + '</span>' + esc(x.supports) + '</p>' +
          '<p class="source-by"><span class="d-sub">' + esc(s.sourceLabel) + '</span>' + rich(x.source) + '</p>' +
          '<p class="source-links">' + x.links.map((u) => '<a href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(u) + '</a>').join('') + '</p>' +
        '</li>').join('') + '</ol></div>';
  }

  function renderFooter() {
    const f = DATA.footer;
    $('#footer').innerHTML = '<div class="container"><p>' + esc(f.line1) + '</p><p>' + esc(f.line2) + '</p>' +
      '<p class="links">' + f.links.map((l) => '<a href="' + esc(l.href) + '" target="_blank" rel="noopener noreferrer">' + esc(l.label) + ico('external-link') + '</a>').join('') + '</p></div>';
  }

  /* =======================================================================
     Behaviour
     ======================================================================= */
  function initCanvasToggles() {
    const grid = $('#canvas-grid');
    grid.addEventListener('click', function (e) {
      const toggle = e.target.closest('.toggle');
      if (toggle) {
        const block = toggle.closest('.block');
        const open = !block.classList.contains('is-open');
        block.classList.toggle('is-open', open);
        toggle.setAttribute('aria-expanded', String(open));
        $('.toggle-label', toggle).textContent = open ? DATA.ui.collapse : DATA.ui.expand;
        return;
      }
      const viewBtn = e.target.closest('[data-view]');
      if (viewBtn && viewBtn.tagName === 'BUTTON') {
        const block = viewBtn.closest('.block');
        const key = viewBtn.getAttribute('data-view');
        $$('.seg [data-view]', block).forEach(function (b) { b.setAttribute('aria-pressed', String(b === viewBtn)); });
        $$('[data-view-panel]', block).forEach(function (p) { p.hidden = p.getAttribute('data-view-panel') !== key; });
      }
    });
  }

  /* Theme: light by default; the saved choice is applied before paint (see <head>). */
  function initTheme() {
    const root = document.documentElement;
    const btn = $('#btn-theme');
    function paint() {
      const dark = root.getAttribute('data-theme') === 'dark';
      const label = dark ? DATA.ui.lightMode : DATA.ui.darkMode;
      $('.ico', btn).innerHTML = ico(dark ? 'sun' : 'moon');
      $('.txt', btn).textContent = label;
      btn.setAttribute('aria-label', label);
      btn.setAttribute('title', label);
      refreshIcons(btn);
    }
    btn.addEventListener('click', function () {
      const dark = root.getAttribute('data-theme') !== 'dark';
      if (dark) root.setAttribute('data-theme', 'dark'); else root.removeAttribute('data-theme');
      try { localStorage.setItem('maternasync-bm-theme', dark ? 'dark' : 'light'); } catch (e) { /* session only */ }
      paint();
    });
    paint();
  }

  /* Presentation Mode: hides the bars, shows an exit pill; Esc leaves. */
  function initPresentation() {
    const btn = $('#btn-present');
    const pill = $('#exit-pill');
    function set(on) {
      document.body.classList.toggle('presenting', on);
      const label = on ? DATA.ui.exitPresent : DATA.ui.present;
      $('.txt', btn).textContent = label;
      btn.setAttribute('aria-label', label);
      if (on) {
        window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' });
        pill.focus({ preventScroll: true });
      } else {
        btn.focus({ preventScroll: true });
      }
    }
    btn.addEventListener('click', function () { set(!document.body.classList.contains('presenting')); });
    pill.addEventListener('click', function () { set(false); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && document.body.classList.contains('presenting')) set(false);
    });
  }

  function initPrint() {
    $('#btn-print').addEventListener('click', function () { window.print(); });
  }

  /* Highlight the sub-navigation link of the section in view. */
  function initScrollSpy() {
    const links = $$('#subnav a');
    const sections = links.map(function (a) { return document.getElementById(a.getAttribute('data-id')); });
    let ticking = false;
    function update() {
      ticking = false;
      const bars = document.body.classList.contains('presenting') ? 0 : 60 + 48;
      const line = bars + 80;
      let current = -1;
      sections.forEach(function (s, i) { if (s && s.getBoundingClientRect().top <= line) current = i; });
      // the Sources list belongs to the Evidence link
      const src = document.getElementById('sources');
      const ev = links.findIndex(function (a) { return a.getAttribute('data-id') === 'evidence'; });
      if (src && ev >= 0 && src.getBoundingClientRect().top <= line) current = ev;
      links.forEach(function (a, i) {
        a.classList.toggle('active', i === current);
        if (i === current) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
      });
    }
    window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
    window.addEventListener('resize', update);
    update();
  }

  /* Scroll reveal (the app's fadeIn) and the go-to-market progress line. */
  function initReveal() {
    const items = $$('.reveal');
    const track = $('#track');
    if (!('IntersectionObserver' in window) || reduceMotion()) {
      items.forEach(function (el) { el.classList.add('in-view'); });
      if (track) track.classList.add('is-on');
      return;
    }
    const io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add('in-view'); io.unobserve(en.target); }
      });
    }, { rootMargin: '0px 0px -5% 0px', threshold: 0.02 });
    items.forEach(function (el) { io.observe(el); });

    const tio = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add('is-on'); tio.unobserve(en.target); }
      });
    }, { threshold: 0.3 });
    tio.observe(track);
  }

  /* "View the Canvas" and the brand link scroll without leaving a hash behind when bars are hidden. */
  function initAnchors() {
    $('#brand-link').addEventListener('click', function (e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' });
    });
  }

  /* =======================================================================
     Start
     ======================================================================= */
  renderChrome();
  renderHero();
  renderCanvas();
  renderGtm();
  renderPackages();
  renderPilot();
  renderEvidence();
  renderSources();
  renderFooter();

  initCanvasToggles();
  initTheme();
  initPresentation();
  initPrint();
  initScrollSpy();
  initReveal();
  initAnchors();

  /* The icon library is loaded with "defer": draw the icons once it is there. */
  refreshIcons();
  document.addEventListener('DOMContentLoaded', function () { refreshIcons(); });
  window.addEventListener('load', function () { refreshIcons(); });
})();
</script>
</body>
